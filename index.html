<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trig Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one 760px column — arcade screen on top, RPG dialog box below. Single deliberate dark palette (PICO-8 inspired). */
:root{
  --ink:#0b0a18; --void:#0d0b1e; --deep:#141c3f; --night:#1d2b53; --plum:#7e2553;
  --steel:#c2c3c7; --paper:#fff1e8; --red:#ff004d; --orange:#ffa300; --yellow:#ffec27;
  --green:#00e436; --moss:#008751; --blue:#29adff; --lav:#83769c; --pink:#ff77a8;
  --f-pixel:"Press Start 2P", "Courier New", monospace;
  --f-thai:"Chakra Petch", "Tahoma", "Leelawadee UI", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--void);color:var(--paper)}
body{font-family:var(--f-thai);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 50% -10%, #241a4a 0, transparent 60%);
  background-attachment:fixed;}
.wrap{max-width:760px;margin:0 auto;padding-block:14px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em}
.brand{color:var(--yellow);text-shadow:2px 2px 0 var(--red)}
.score{margin-left:auto;color:var(--steel)}
.score b{color:var(--paper);font-weight:400;font-variant-numeric:tabular-nums}
.icon-btn{font-family:var(--f-pixel);font-size:9px;color:var(--paper);background:var(--night);border:2px solid var(--lav);padding:6px 8px;cursor:pointer}
.icon-btn:hover{border-color:var(--yellow)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.pframe{border:4px solid var(--paper);
  clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}

.screen{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--ink);overflow:hidden}
.screen canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.16) 2px 3px),
  radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%)}
.screen.shake{animation:shake .38s steps(6)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,2px)}100%{transform:translate(0,0)}}

.logo{position:absolute;left:0;right:0;top:7%;text-align:center;pointer-events:none}
.logo h1{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:clamp(20px,6.4vw,46px);line-height:1.1;color:var(--yellow);
  text-shadow:3px 3px 0 var(--red), 6px 6px 0 var(--ink);letter-spacing:.04em}
.logo p{margin:.5em 0 0;font-weight:700;font-size:clamp(12px,2.6vw,17px);color:var(--paper);text-shadow:2px 2px 0 var(--ink)}

.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:2.2% 2.6%;pointer-events:none;font-family:var(--f-pixel)}
.hearts{display:flex;gap:3px}
.hearts svg{width:clamp(12px,2.8vw,20px);height:auto;color:var(--red);filter:drop-shadow(2px 2px 0 var(--ink))}
.hearts svg.empty{color:#3a2a44}
.combo{margin-top:6px;font-size:clamp(7px,1.6vw,10px);color:var(--yellow);text-shadow:2px 2px 0 var(--ink);min-height:1em}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:42%}
.bname{font-size:clamp(7px,1.6vw,10px);color:var(--paper);text-shadow:2px 2px 0 var(--ink);text-align:right}
.hpbar{position:relative;width:100%;height:clamp(8px,1.8vw,12px);background:var(--ink);border:2px solid var(--paper)}
.hpbar i{position:absolute;left:0;top:0;bottom:0;display:block}
.hpbar .ghost{background:var(--paper);transition:width .6s .25s steps(8)}
.hpbar .fill{background:linear-gradient(var(--pink) 0 35%, var(--red) 35%);transition:width .25s steps(4)}

.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--f-pixel);font-size:clamp(16px,5.6vw,38px);
  color:var(--yellow);text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink);animation:pop .35s steps(4);pointer-events:none}
.banner.good{color:var(--green);text-shadow:3px 3px 0 var(--moss),6px 6px 0 var(--ink)}
.banner.bad{color:var(--red);text-shadow:3px 3px 0 var(--plum),6px 6px 0 var(--ink)}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.floats{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-pixel);font-size:clamp(10px,2.6vw,16px);color:var(--paper);
  text-shadow:2px 2px 0 var(--ink);animation:floatUp .95s steps(10) forwards;white-space:nowrap}
.float.crit{color:var(--yellow);font-size:clamp(12px,3.2vw,20px)}
.float.hurt{color:var(--red)}
@keyframes floatUp{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-34px}}

.timer{height:12px;background:var(--ink);border:2px solid var(--lav);position:relative}
.timer i{position:absolute;left:0;top:0;bottom:0;display:block;width:100%;background:var(--green)}
.timer.low i{background:var(--red);animation:blink .4s steps(2) infinite}
.timer.idle i{background:var(--lav);opacity:.4}
@keyframes blink{50%{opacity:.35}}

.panel{background:var(--deep);padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-height:220px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;color:var(--ink);background:var(--yellow);padding:5px 7px}
.tag.alt{background:var(--lav);color:var(--paper)}
.qbody{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.qbody canvas{flex:0 0 auto;background:var(--ink);border:2px solid var(--night);max-width:100%}
.qtext{flex:1 1 220px;min-width:0;margin:0;font-size:clamp(18px,3.4vw,22px);font-weight:600;line-height:1.5;text-wrap:balance}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ans{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 12px;font-family:var(--f-thai);font-size:clamp(17px,3.2vw,20px);font-weight:600;
  color:var(--paper);background:var(--night);border:3px solid var(--lav);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.ans:hover:not(:disabled){border-color:var(--yellow);transform:translateY(-1px)}
.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ans .k{flex:0 0 auto;font-family:var(--f-pixel);font-size:9px;color:var(--ink);background:var(--yellow);padding:5px 6px}
.ans span:last-child{min-width:0}
.ans:disabled{cursor:default}
.ans.ok{background:var(--moss);border-color:var(--green)}
.ans.bad{background:var(--plum);border-color:var(--red)}
.ans.dim{opacity:.45}

.fb{border-left:6px solid var(--green);background:rgba(0,0,0,.25);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.bad{border-color:var(--red)}
.fb h3{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:11px;line-height:1.6;color:var(--green)}
.fb.bad h3{color:var(--red)}
.fb p{margin:0;font-size:17px;max-width:65ch}
.fb .row{display:flex;justify-content:flex-end}

.btn{font-family:var(--f-thai);font-weight:700;font-size:18px;color:var(--paper);background:var(--red);border:3px solid var(--ink);
  box-shadow:0 5px 0 var(--plum),0 5px 0 3px var(--ink);padding:10px 20px;cursor:pointer}
.btn:hover{background:#ff2a66}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--plum),0 1px 0 3px var(--ink)}
.btn.ghost{background:var(--night);box-shadow:0 5px 0 var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;align-items:center}

h2{margin:0;font-size:clamp(22px,4.4vw,30px);font-weight:700;line-height:1.25;text-wrap:balance}
h2 small{display:block;font-family:var(--f-pixel);font-size:10px;font-weight:400;color:var(--pink);letter-spacing:.08em;margin-top:6px}
.lead{margin:0;font-size:17px;max-width:62ch;color:var(--steel)}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.roster li{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.25);padding:10px;min-width:0}
.roster img{width:52px;height:auto;image-rendering:pixelated;flex:0 0 auto}
.roster .st{font-family:var(--f-pixel);font-size:8px;color:var(--yellow);letter-spacing:.08em}
.roster b{display:block;font-size:16px;line-height:1.3}
.roster span{display:block;font-size:13px;color:var(--steel);line-height:1.35}
.howto{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--steel)}
.howto b{color:var(--yellow);font-weight:600}
.best{font-family:var(--f-pixel);font-size:9px;color:var(--steel);margin-right:auto}
.best b{color:var(--yellow);font-weight:400}

.scroll{background:#efe2c8;color:#2a1a10;padding:14px 16px;border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #c9a97a}
.scroll h3{margin:0 0 10px;font-family:var(--f-pixel);font-weight:400;font-size:10px;letter-spacing:.08em;color:var(--plum)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff8ea;border:2px solid #2a1a10;padding:5px 10px;font-weight:700;font-size:16px}
.note{margin:10px 0 0;font-size:14px;line-height:1.5}
.tw{overflow-x:auto}
.scroll table{border-collapse:collapse;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.scroll th,.scroll td{border:2px solid #2a1a10;padding:5px 10px;text-align:center;white-space:nowrap}
.scroll th{background:#2a1a10;color:#efe2c8;font-weight:600}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,120px));gap:0;margin-top:10px}
.quad div{border:2px solid #2a1a10;padding:6px 8px;font-weight:700;font-size:14px;text-align:center}
.quad div:nth-child(1){border-right-width:1px;border-bottom-width:1px}.quad div:nth-child(2){border-left-width:1px;border-bottom-width:1px}
.quad div:nth-child(3){border-right-width:1px;border-top-width:1px}.quad div:nth-child(4){border-left-width:1px;border-top-width:1px}
details.cheat summary{cursor:pointer;font-family:var(--f-pixel);font-size:9px;color:var(--lav);letter-spacing:.06em;padding:4px 0}
details.cheat[open] summary{margin-bottom:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:rgba(0,0,0,.25);padding:10px 12px}
.stat span{display:block;font-size:13px;color:var(--steel)}
.stat b{font-family:var(--f-pixel);font-weight:400;font-size:15px;color:var(--yellow);font-variant-numeric:tabular-nums}
.rank{font-family:var(--f-pixel);font-size:44px;color:var(--yellow);text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink);line-height:1}

.lvrow{display:flex;gap:5px;align-items:center;margin-top:5px;font-size:clamp(7px,1.6vw,10px);color:var(--blue);text-shadow:2px 2px 0 var(--ink)}
.xp{position:relative;width:clamp(30px,9vw,60px);height:5px;background:var(--ink);border:1px solid var(--paper)}
.xp i{position:absolute;left:0;top:0;bottom:0;display:block;background:var(--blue)}
.tier{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;padding:5px 7px;color:var(--ink);background:var(--steel)}
.tier.t1{background:var(--blue)}
.tier.t2{background:var(--pink)}
.tier.t3{background:var(--yellow);box-shadow:3px 3px 0 var(--red)}
.tiers{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel.t1{border-color:var(--blue);background:linear-gradient(#12305c,var(--deep) 55%)}
.panel.t2{border-color:var(--pink);background:linear-gradient(#3a1446,var(--deep) 60%)}
.panel.t3{border-color:var(--yellow);background:linear-gradient(#5a3208,#3a1446 40%,var(--deep) 80%);animation:legend .9s steps(2) infinite}
@keyframes legend{50%{border-color:var(--orange)}}
.panel.t1 .ans{border-color:var(--blue)}
.panel.t2 .ans{border-color:var(--pink)}
.panel.t3 .ans{border-color:var(--orange)}
.panel .ans.ok{border-color:var(--green)}
.panel .ans.bad{border-color:var(--red)}
.banner.t1{color:var(--blue);text-shadow:3px 3px 0 var(--night),6px 6px 0 var(--ink)}
.banner.t2{color:var(--pink);text-shadow:3px 3px 0 var(--plum),6px 6px 0 var(--ink)}
.float.skill{font-size:clamp(9px,2.2vw,14px);color:var(--orange)}
.float.skill.t2{color:var(--blue)}
.float.skill.t3{color:var(--pink)}
/* question frame */
.panel.q{--tc:var(--steel);--tc2:var(--lav);--tbg:#1a2350;position:relative;border-color:var(--tc);padding-top:0;padding-bottom:26px;
  background:repeating-linear-gradient(45deg,rgba(255,241,232,.035) 0 2px,transparent 2px 8px),linear-gradient(var(--tbg),var(--deep) 70%);
  box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px var(--tc2)}
.panel.q.t1{--tc:var(--blue);--tc2:#1763a8;--tbg:#12305c}
.panel.q.t2{--tc:var(--pink);--tc2:var(--plum);--tbg:#3a1446}
.panel.q.t3{--tc:var(--yellow);--tc2:var(--orange);--tbg:#4a2a08}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 -18px;padding:11px 20px 10px;background:var(--tc);color:var(--ink);
  font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;border-bottom:4px solid var(--ink);box-shadow:0 3px 0 var(--tc2)}
.qgem{flex:0 0 auto;width:10px;height:10px;margin:0 3px;background:var(--paper);transform:rotate(45deg);box-shadow:0 0 0 2px var(--ink)}
.qtier{font-size:12px}
.qmeta{margin-left:auto;font-size:8px}
.qdmg{background:var(--ink);color:var(--tc);padding:5px 7px;font-size:8px}
.qtopic{font-size:13px;font-weight:600;color:var(--tc);letter-spacing:.02em}
.panel.q::before,.panel.q::after{content:"";position:absolute;bottom:9px;width:14px;height:14px;border-bottom:4px solid var(--tc);pointer-events:none}
.panel.q::before{left:9px;border-left:4px solid var(--tc)}
.panel.q::after{right:9px;border-right:4px solid var(--tc)}
.panel.q .ans{border-color:var(--tc2)}
.panel.q .ans .k{background:var(--tc)}
.panel.q .ans:hover:not(:disabled){border-color:var(--tc)}
.panel.q .ans.ok{border-color:var(--green)}
.panel.q .ans.bad{border-color:var(--red)}
.panel.q.t3 .qhead{background:linear-gradient(90deg,var(--yellow) 0 42%,var(--paper) 50%,var(--yellow) 58% 100%);background-size:300% 100%;animation:shine 1.6s steps(14) infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.float.skill.t0{color:var(--paper)}
/* admin */
.admin{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--steel);border:2px dashed var(--lav);padding:8px 10px}
.admin button,.admin select{font-family:var(--f-thai);font-size:14px;font-weight:600;color:var(--paper);background:var(--night);border:2px solid var(--lav);padding:5px 10px;cursor:pointer}
.admin button:hover{border-color:var(--yellow)}
.admin #admOk{background:var(--moss);border-color:var(--green)}
@media (prefers-reduced-motion:reduce){
  .panel.t3{animation:none}
  .panel.q.t3 .qhead{animation:none}
  .screen.shake,.banner,.float,.timer.low i{animation:none}
  .hpbar i{transition:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">TRIG QUEST</div>
    <div class="score">SCORE <b id="score">000000</b></div>
    <button class="icon-btn" id="mute" type="button" aria-pressed="false">SOUND ON</button>
  </header>

  <div class="screen pframe" id="screen">
    <canvas id="cv" width="160" height="90" aria-label="ฉากต่อสู้"></canvas>
    <div class="logo" id="logo"><h1>TRIG QUEST</h1><p>ตะลุยปราสาทตรีโกณมิติ</p></div>
    <div class="hud" id="hud" hidden>
      <div><div class="hearts" id="hearts"></div><div class="lvrow"><span id="lv">LV 1</span><span class="xp"><i id="xpFill"></i></span></div><div class="combo" id="combo"></div></div>
      <div class="hud-r"><div class="bname" id="bname"></div><div class="hpbar"><i class="ghost" id="hpGhost"></i><i class="fill" id="hpFill"></i></div></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="floats" id="floats"></div>
    <div class="scan"></div>
  </div>

  <div class="timer idle" id="timer"><i id="timerFill"></i></div>

  <div class="admin" id="admin" hidden>
    <span class="tag">ADMIN</span>
    <button id="admOk" type="button">ตอบถูกเลย [0]</button>
    <label for="admTier">ระดับโจทย์ <select id="admTier"><option value="-1">สุ่ม</option><option value="0">NORMAL</option><option value="1">RARE</option><option value="2">EPIC</option><option value="3">LEGEND</option></select></label>
    <label for="admSkill">ท่า <select id="admSkill"><option value="">สุ่ม</option></select></label>
    <button id="admLv" type="button">เลเวล +1</button>
    <button id="admHeal" type="button">เติมหัวใจ</button>
  </div>

  <section class="panel pframe" id="panel" aria-live="polite"></section>
</div>

<script>
/*GEN-START*/
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;const s=n<0?'−':'';n=Math.abs(n);return d===1?s+n:`${s}${n}/${d}`}
const fmtN=n=>n<0?'−'+(-n):String(n);
const neg=s=>s.startsWith('−')?s.slice(1):(s==='0'?'0':'−'+s);
function mk(q,ans,pool,ex,fig,must=[]){
  ans=String(ans);const ch=[ans];
  for(const v of [...must.map(String),...shuffle(pool.map(String))]){if(ch.length>=4)break;if(v&&v!=='NaN'&&!ch.includes(v))ch.push(v)}
  for(const v of ['0','1','−1','2','3','1/2']){if(ch.length>=4)break;if(!ch.includes(v))ch.push(v)}
  const c=shuffle(ch);return {q,choices:c,ans:c.indexOf(ans),ex,fig};
}
const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15],[20,21,29],[9,40,41]];

/* Stage 1: ratios */
function g1ratio(){
  const [a,b,c]=pick(TRIPLES);const sw=Math.random()<.5;const opp=sw?b:a,adj=sw?a:b;const fn=pick(['sin','cos','tan']);
  const v={sin:fr(opp,c),cos:fr(adj,c),tan:fr(opp,adj)};
  const raw={sin:`${opp}/${c}`,cos:`${adj}/${c}`,tan:`${opp}/${adj}`}[fn];
  const rule={sin:'ข้าม/ฉาก',cos:'ชิด/ฉาก',tan:'ข้าม/ชิด'}[fn];
  return mk(`จากรูปสามเหลี่ยมมุมฉาก ${fn} θ มีค่าเท่าใด`,v[fn],[v.sin,v.cos,v.tan,fr(c,opp),fr(c,adj),fr(adj,opp)],
    `${fn} θ = ${rule} = ${raw}${raw!==v[fn]?' = '+v[fn]:''}`,{opp:''+opp,adj:''+adj,hyp:''+c,flip:Math.random()<.5});
}
function g1side(){
  const [a,b,c]=pick(TRIPLES.slice(0,6));const opp=a,adj=b;const w=pick(['hyp','opp','adj']);
  const fig={opp:''+opp,adj:''+adj,hyp:''+c,flip:Math.random()<.5};let ans,ex;

  c.strokeStyle='#83769c';c.lineWidth=2;c.beginPath();c.moveTo(X(128),98);c.lineTo(X(128),88);c.lineTo(X(138),88);c.stroke();
  const a1=Math.atan2(C[1]-A[1],C[0]-A[0]),a2=Math.atan2(B[1]-A[1],B[0]-A[0]);
  c.strokeStyle='#ffec27';c.lineWidth=2;c.beginPath();if(!f.flip)c.arc(A[0],A[1],20,a2,a1);else c.arc(A[0],A[1],20,a1,a2+Math.PI*2);c.stroke();
  c.font='16px "Chakra Petch", sans-serif';c.fillStyle='#ffec27';c.textBaseline='middle';c.textAlign=f.flip?'right':'left';c.fillText('θ',A[0]+(f.flip?-25:25),A[1]-8);
  const lab=(t,x,y,al)=>{if(!t)return;c.font='11px "Press Start 2P", monospace';c.textAlign=al;c.fillStyle=t==='?'?'#ff004d':'#fff1e8';c.fillText(t,x,y)};
  lab(f.opp,X(146),60,f.flip?'right':'left');
  lab(f.adj,X(81),114,'center');
  lab(f.hyp,X(74),50,f.flip?'left':'right');
}
function answer(i){
  if(G.phase!=='asking')return;G.phase='resolving';
  const now=performance.now(),q=G.q,b=boss();const rem=Math.max(0,G.qTime-(now-G.qStart)/1000),frac=rem/G.qTime;
  timerEl.classList.remove('low');
  const ok=i===q.ans;G.total++;
  document.querySelectorAll('.ans').forEach((el,k)=>{el.disabled=true;if(k===q.ans)el.classList.add('ok');else if(k===i)el.classList.add('bad');else el.classList.add('dim')});
  let head;
  if(ok){
    const tier=q.tier||0,sk=pickSkill(tier),tok=G.tok,f0=heroForm();
    G.correct++;G.stCorrect++;G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);
    const crit=frac>.6;let dmg=Math.round((14+frac*10+Math.min(G.combo-1,5)*2+(G.lv-1)*2)*TMULT[tier]);if(crit)dmg=Math.round(dmg*1.4);
    G.score+=dmg*10+Math.round(frac*100)+tier*150;
    G.bossHp=Math.max(0,G.bossHp-dmg);const kill=G.bossHp<=0,hpAfter=G.bossHp;
    G.xp+=TXP[tier];let up=false;while(G.xp>=xpNeed()){G.xp-=xpNeed();G.lv++;up=true}
    SFX.ok();S.crit=crit;
    S.heroA={type:sk.anim,t0:now,stay:sk.stay,jump:sk.jump,dur:sk.dur,tier};
    S.fx={id:sk.id,tier,t0:now,hit:sk.hit,dur:sk.dur+(kill?700:0),fin:kill};
    if(sk.sfx)SFX[sk.sfx]();
    floatText(sk.n,36,44,'skill t'+tier);
    setTimeout(()=>{if(tok!==G.tok)return;const t=performance.now(),bs=bossState(t);
      if(!sk.sfx)crit?SFX.crit():SFX.hit();
      G.dispHp=hpAfter;S.bossA={type:'hurt',t0:t};explode(bs.cx,bs.cy,FXC[tier],10+tier*10+(crit?8:0));
      floatText((crit?'CRIT! ':'')+'-'+dmg,bs.cx,bs.y-4,crit||tier>1?'crit':'');if(crit||tier>1)shake();hud();
      if(up){const f1=heroForm(),fu=f1>f0;floatText(fu?'FORM UP! '+FORMS[f1].n:'LEVEL UP!',fu?62:36,fu?28:34,'crit');SFX.lvl();if(fu)explode(36,64,FORMS[f1].aura,45)}
      if(kill){S.bossA={type:'die',t0:t+350};SFX.fin();shake();showBanner(FIN[tier],900,'t'+tier);explode(bs.cx,bs.cy,['#fff1e8','#ffec27','#ff004d'],40+tier*30);
        setTimeout(()=>{if(tok!==G.tok)return;showBanner('K.O.!',1400,'good');stopMusic();SFX.win()},1000)}
    },sk.hit);
    head=`ถูกต้อง! ${kill?FIN[tier]:sk.n}${crit?' คริติคอล':''} ${dmg} ดาเมจ${G.combo>1?` · คอมโบ x${G.combo}`:''}${up?` · เลเวลอัป LV ${G.lv}`:''}`;
  }else{
    G.combo=0;SFX.bad();S.bossA={type:'attack',t0:now};
    setTimeout(()=>{const bs=bossState(performance.now());S.proj.push({t0:performance.now(),dur:280,x0:bs.x,y0:bs.cy,x1:36,y1:64,kind:b.proj})},230);
    setTimeout(()=>{G.hearts--;SFX.hurt();shake();S.heroA={type:'hurt',t0:performance.now()};explode(36,64,['#ff004d','#fff1e8'],12);floatText('-1 ♥',36,52,'hurt');hud();
      if(G.hearts<=0){S.heroA={type:'down',t0:performance.now()};stopMusic();setTimeout(()=>{showBanner('GAME OVER',0,'bad');SFX.lose()},400)}},520);
    head=i<0?'หมดเวลา! บอสสวนกลับ':'ยังไม่ใช่! บอสสวนกลับ';
  }
  hud();
  const dead=ok&&G.bossHp<=0,over=!ok&&G.hearts<=0;
  const btn=dead?(G.stage===3?'ดูผลการผจญภัย ▶':'ผ่านด่าน ▶'):over?'ดูผล ▶':'ข้อต่อไป ▶';
  $('#fbSlot').innerHTML=`<div class="fb ${ok?'':'bad'}"><h3>${esc(head)}</h3>
    ${ok?'':`<p><b>คำตอบที่ถูก:</b> ${esc(q.choices[q.ans])}</p>`}<p>${esc(q.ex)}</p>
    <div class="row"><button class="btn" data-act="${dead?'clear':over?'over':'next'}" data-primary>${btn}</button></div></div>`;
  const nb=$('#fbSlot .btn');nb.focus({preventScroll:true});$('#fbSlot').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function stageClear(){
  G.phase='idle';setTimerIdle();
  if(G.stage===3)return victory();
  const b=boss();const gain=G.hearts<5?1:0;G.hearts+=gain;hud();
  S.heroA={type:'win',t0:performance.now()};showBanner('STAGE CLEAR',1600,'good');
  panel.className='panel pframe';panel.innerHTML=`<h2>ปราบ${b.name}สำเร็จ!<small>${b.en} DEFEATED</small></h2>
   <div class="stats"><div class="stat"><span>ตอบถูกในด่านนี้</span><b>${G.stCorrect}/${G.qn}</b></div><div class="stat"><span>คอมโบสูงสุด</span><b>x${G.bestCombo}</b></div>
   <div class="stat"><span>หัวใจ</span><b>${G.hearts}/5${gain?' (+1)':''}</b></div><div class="stat"><span>เลเวล</span><b>LV ${G.lv}</b><span>${FORMS[heroForm()].n}</span></div></div>
   <p class="lead">บอสถัดไป: <b>${BOSSES[G.stage+1].name}</b> คุมหัวข้อ${BOSSES[G.stage+1].topic}</p>
   <div class="btns"><button class="btn" data-act="nextStage" data-primary>ไปด่านต่อไป ▶</button></div>`;
}
function victory(){
  const acc=G.total?Math.round(G.correct/G.total*100):0;const rank=acc>=90?'S':acc>=75?'A':acc>=60?'B':'C';
  const isBest=G.score>best;if(isBest){best=G.score;try{localStorage.setItem('trigquest-best',best)}catch(e){}}
  S.heroA={type:'win',t0:performance.now()};showBanner('VICTORY!',0,'good');
  panel.className='panel pframe';panel.innerHTML=`<div class="tags"><span class="tag">ALL STAGES CLEAR</span>${isBest?'<span class="tag alt">NEW BEST</span>':''}</div>
   <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="rank">${rank}</div><h2>ปราสาทตรีโกณมิติแตกแล้ว!<small>THE UNIT CIRCLE IS YOURS</small></h2></div>
   <div class="stats"><div class="stat"><span>คะแนน</span><b>${String(G.score).padStart(6,'0')}</b></div><div class="stat"><span>ความแม่นยำ</span><b>${acc}%</b></div>
   <div class="stat"><span>ตอบถูก</span><b>${G.correct}/${G.total}</b></div><div class="stat"><span>เลเวล</span><b>LV ${G.lv}</b><span>${FORMS[heroForm()].n}</span></div><div class="stat"><span>คอมโบสูงสุด</span><b>x${G.bestCombo}</b></div></div>
   <div class="btns"><button class="btn ghost" data-act="home">หน้าแรก</button><button class="btn" data-act="start" data-primary>เล่นอีกครั้ง ▶</button></div>`;
}
function gameOver(){
  G.phase='idle';setTimerIdle();
  const isBest=G.score>best;if(isBest){best=G.score;try{localStorage.setItem('trigquest-best',best)}catch(e){}}
  panel.className='panel pframe';panel.innerHTML=`<h2>หัวใจหมดแล้ว…<small>DEFEATED BY ${boss().en}</small></h2>
   <p class="lead">ทบทวนคัมภีร์ของด่านนี้แล้วกลับไปลุยใหม่ บอสจะเริ่มด้วย HP เต็ม ส่วนคุณได้หัวใจคืนครบ 5 ดวง</p>
   <div class="stats"><div class="stat"><span>คะแนน</span><b>${String(G.score).padStart(6,'0')}</b></div><div class="stat"><span>ด่านที่ไปถึง</span><b>${G.stage+1}/4</b></div></div>
   <div class="scroll"><h3>คัมภีร์: ${boss().topic}</h3>${boss().tip}</div>
   <div class="btns"><button class="btn ghost" data-act="home">หน้าแรก</button><button class="btn" data-act="retry" data-primary>สู้บอสนี้อีกครั้ง ▶</button></div>`;
}

panel.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a!=='ans')SFX.sel();
  if(a==='start'){initAudio();newGame()}
  else if(a==='fight'){initAudio();showBanner('FIGHT!',900);nextQuestion()}
  else if(a==='ans')answer(+t.dataset.i);
  else if(a==='next'){banner.hidden=true;nextQuestion()}
  else if(a==='clear')stageClear();
  else if(a==='nextStage'){G.stage++;stageIntro()}
  else if(a==='over')gameOver();
  else if(a==='retry'){G.hearts=5;banner.hidden=true;stageIntro()}
  else if(a==='home'){G.tok++;stopMusic();renderTitle()}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SUMMARY')return;
  if(G.phase==='asking'){if(admin&&e.key==='0'){e.preventDefault();answer(G.q.ans);return}const m={'1':0,'2':1,'3':2,'4':3}[e.key];if(m!==undefined){e.preventDefault();answer(m)}return}
  if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){const p=panel.querySelector('[data-primary]');if(p){e.preventDefault();p.click()}}
});
$('#mute').addEventListener('click',e=>{muted=!muted;if(master)master.gain.value=muted?0:.22;e.currentTarget.textContent=muted?'SOUND OFF':'SOUND ON';e.currentTarget.setAttribute('aria-pressed',muted)});

let admin=false,brandTaps=0,brandT=0;
function setAdmin(on){admin=on;$('#admin').hidden=!on}
$('.brand').addEventListener('click',()=>{const n=Date.now();brandTaps=n-brandT<600?brandTaps+1:1;brandT=n;if(brandTaps>=5){brandTaps=0;setAdmin(!admin)}});
if(location.hash==='#admin')setAdmin(true);
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')setAdmin(true)});
$('#admOk').addEventListener('click',()=>{if(G.phase==='asking')answer(G.q.ans)});
SKILLS.forEach((ts,t)=>ts.forEach(k=>{const o=document.createElement('option');o.value=k.id;o.textContent=TNAME[t].split(' ')[0]+' · '+k.n;$('#admSkill').appendChild(o)}));
$('#admSkill').addEventListener('change',e=>{admSkill=e.target.value;const t=SKILLS.findIndex(ts=>ts.some(k=>k.id===admSkill));if(t>=0)$('#admTier').value=t});
$('#admLv').addEventListener('click',()=>{G.lv++;if(S.mode==='battle')hud()});
$('#admHeal').addEventListener('click',()=>{if(S.mode==='battle'&&G.hearts>0){G.hearts=5;hud()}});
renderTitle();requestAnimationFrame(frame);
</script>
